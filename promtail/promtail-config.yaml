server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: voidsink
  static_configs:
  - targets:
      - localhost
    labels:
      job: voidsink
      __path__: /var/log/voidsink/voidsink.log
  pipeline_stages:
  - json:
      expressions:
        timestamp: timestamp
        protocol: protocol
        source_ip: source_ip
        target_port: target_port
  - labels:
      protocol:
      source_ip:
  - timestamp:
      source: timestamp
      format: RFC3339
